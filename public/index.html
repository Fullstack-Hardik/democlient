<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Generator | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Traffic Controller</h1>
            <p>Real-time website traffic simulation.</p>
        </header>

        <main>
            <section class="card config-card">
                <h2>Configuration</h2>
                
                <div class="form-group">
                    <label for="savedProjects">Saved Projects</label>
                    <select id="savedProjects">
                        <option value="">-- Select a saved project or enter new below --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="urlInput">Target URL</label>
                    <div class="input-with-btn">
                        <input type="url" id="urlInput" placeholder="https://example.com" value="" required>
                        <button id="saveProjectBtn" class="btn secondary">Save Link</button>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label for="rpsInput">Speed (Requests per Second)</label>
                        <input type="number" id="rpsInput" min="0.1" step="0.1" value="1">
                        <small>E.g., 1 RPS = 60 RPM</small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="proxyInput">Proxies (Optional - for International IPs)</label>
                    <textarea id="proxyInput" placeholder="ip:port\nip:port:user:pass\nOne proxy per line" rows="4"></textarea>
                    <small>Leave empty to use your current IP. Proxies enable random countries.</small>
                </div>

                <div class="actions">
                    <button id="startBtn" class="btn primary">Start Traffic</button>
                    <button id="stopBtn" class="btn danger" disabled>Stop Traffic</button>
                </div>
            </section>

            <section class="card metrics-card">
                <h2>Live Metrics</h2>
                <div class="metrics-grid">
                    <div class="metric-box">
                        <span class="label">Requests Sent</span>
                        <span class="value" id="reqSentVal">0</span>
                    </div>
                    <div class="metric-box">
                        <span class="label">Successful Views (200 OK)</span>
                        <span class="value success" id="viewsVal">0</span>
                    </div>
                    <div class="metric-box">
                        <span class="label">Errors / Blocks</span>
                        <span class="value danger" id="errorsVal">0</span>
                    </div>
                    <div class="metric-box">
                        <span class="label">Active Browsers</span>
                        <span class="value" id="activeBrowsersVal">0</span>
                    </div>
                </div>
                <div class="status-indicator">
                    Status: <span id="statusText" class="offline">Offline</span>
                </div>
            </section>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
